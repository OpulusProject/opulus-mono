# Docker image tests: each service's image builds from its Dockerfile, starts the
# way a platform starts it (the image's own CMD, migrations included), reports
# ready, and exits 0 when stopped. The other suites run the services from source,
# so none of them would notice a broken Dockerfile.
#
# Slow (three image builds), so it is its own workflow.

name: Docker Image Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  images:
    name: Docker image tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The containers reach these through host.docker.internal (the suite rewrites "localhost").
      DATABASE_URL: postgresql://app:app_dev@localhost:5432/app_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      BETTER_AUTH_SECRET: ci-image-tests-secret-not-for-production
      CLIENT_URL: http://localhost:5173

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_dev
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Docker image tests
        run: pnpm --filter @opulus/tests test:deployment-images
