# ESLint across every package.
#
# Type Check catches type errors; this catches the other things ESLint finds,
# such as unused variables, switch cases that fall through, and (in the
# frontend) the project's import and export ordering rules. Warnings don't fail
# the check, only errors do.

name: Lint

on:
  pull_request:
  # Check main itself after a merge: PRs are checked against the base they were
  # opened on, so two PRs that pass alone can still fail together.
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main are not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The frontend's lint rules use type information, which needs the core
      # package's generated Prisma client and build output.
      - name: Generate Prisma client
        run: pnpm --filter @opulus/core prisma:generate

      - name: Build core package
        run: pnpm --filter @opulus/core build

      - name: Lint all packages
        run: pnpm -r lint
