# Service API test suites, run as required status checks on every PR (including ones stacked on another branch), and again on main after each merge.
#
# Two independent gates, one per HTTP service:
#   - "Backend service-api tests"  -> exercises @opulus/backend over REST
#   - "Webhooks service-api tests" -> exercises @opulus/webhooks over REST
#   - "Scheduler service-api tests" -> exercises @opulus/scheduler over REST, against a
#     stub of its provider (not yet a required check)
#
# Each job provisions the service's dependencies (Postgres, and Redis for the
# webhooks receiver), boots the service exactly as the repo does, and points the
# black-box Playwright suite at it via TEST_BASE_URL. The suites read state over
# HTTP; for no-create-endpoint resources they seed the same isolated CI database
# via the db helper — provisioning lives here in the pipeline, never in the tests.
#
# Merge gating requires TWO things:
#   1. this workflow running on pull requests, AND
#   2. branch protection marking each job below (by name) as a required status
#      check. A green/red run alone does not block merges.

name: Service API Tests

on:
  pull_request:
  # Check main itself after a merge: PRs are checked against the base they were
  # opened on, so two PRs that pass alone can still fail together.
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Branch protection matches this job by NAME ("Backend service-api tests").
  # Keep it stable — renaming silently removes the gate until protection is
  # updated.
  # ---------------------------------------------------------------------------
  backend-service-api-tests:
    name: Backend service-api tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://app:app_dev@localhost:5432/app_test?schema=public
      # The suite seeds no-create-endpoint resources (items/transactions) into
      # this same isolated CI database via the db helper; reads stay over HTTP.
      TEST_DATABASE_URL: postgresql://app:app_dev@localhost:5432/app_test?schema=public
      BETTER_AUTH_SECRET: ci-service-api-tests-secret-not-for-production
      # Test-only key (the base64 of a fixed 32-character string). Encrypts
      # nothing of value; production sets its own.
      ITEM_TOKEN_ENCRYPTION_KEY: Y2ktdGVzdC1vbmx5LW5vdC1hLXJlYWwta2V5LTAwMDA=
      CLIENT_URL: http://localhost:5173
      NODE_ENV: test
      PORT: "8080"
      # The service suite makes no third-party calls, so it does not ask Have I
      # Been Pwned about the (common) password its test users sign up with.
      BREACHED_PASSWORD_CHECK: "off"
      # One address makes every request in the suite: raise the per-IP limit so
      # only the per-user limits (and their own spec) are ever reached.
      RATE_LIMIT_PER_IP: "100000"
      # Dummy Plaid creds — the service suite never round-trips Plaid.
      # Specs that touch Plaid's real API live in the integration suite
      # (.github/workflows/integration-tests.yml), which injects real
      # sandbox credentials from repo secrets.
      PLAID_CLIENT_ID: ci-test
      PLAID_SECRET: ci-test
      PLAID_ENV: sandbox
      # What the backend asks Plaid for is checked against a stub of Plaid's API
      # (opulus-tests/services/backend/stub/plaid.mjs), started below.
      PLAID_BASE_URL: http://localhost:4546
      PLAID_REDIRECT_URI: http://localhost:5173/settings/connections
      TEST_BASE_URL: http://localhost:8080

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_dev
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @opulus/core prisma:generate

      - name: Build core package
        run: pnpm --filter @opulus/core build

      - name: Apply database migrations
        run: pnpm --filter @opulus/core exec prisma migrate deploy --schema=./prisma/schema.prisma

      - name: Start the Plaid stub
        run: |
          node opulus-tests/services/backend/stub/plaid.mjs &
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:4546/health" >/dev/null; then
              echo "Plaid stub is up"; exit 0
            fi
            sleep 1
          done
          echo "Plaid stub did not start in time" >&2
          exit 1

      - name: Boot backend service
        run: |
          NODE_V8_COVERAGE="$GITHUB_WORKSPACE/coverage/backend" pnpm --filter @opulus/backend exec tsx src/server.ts &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 60); do
            if curl -sf "$TEST_BASE_URL/health" >/dev/null; then
              echo "Backend is up"; exit 0
            fi
            sleep 1
          done
          echo "Backend did not become healthy in time" >&2
          exit 1

      - name: Run core unit tests
        run: pnpm --filter @opulus/tests test:unit-core

      - name: Run backend service-api tests
        run: pnpm --filter @opulus/tests test:services-backend

      # How much of the service's code the suite ran, for finding what no test
      # reaches. Informational: it never fails the job. The service is stopped
      # with SIGTERM so it writes its coverage on the way out.
      - name: Report Backend coverage
        if: always()
        continue-on-error: true
        run: |
          pkill -TERM -f "src/server.ts" || true
          sleep 5
          {
            echo '### Backend coverage (lines the service-api suite ran)'
            echo '```'
            pnpm exec c8 report --temp-directory coverage/backend --report-dir coverage/backend-report \
              --reporter text-summary --reporter lcovonly --all --src opulus-backend/src --src opulus-core/src \
              --exclude-after-remap --exclude '**/node_modules/**' --exclude '**/*.d.ts'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Backend coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage/backend-report
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Branch protection matches this job by NAME ("Webhooks service-api tests").
  # ---------------------------------------------------------------------------
  webhooks-service-api-tests:
    name: Webhooks service-api tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://app:app_dev@localhost:5432/app_test?schema=public
      TEST_DATABASE_URL: postgresql://app:app_dev@localhost:5432/app_test?schema=public
      NODE_ENV: test
      # Test-only key, as in the backend job above.
      ITEM_TOKEN_ENCRYPTION_KEY: Y2ktdGVzdC1vbmx5LW5vdC1hLXJlYWwta2V5LTAwMDA=
      WEBHOOK_PORT: "8081"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      PLAID_CLIENT_ID: ci-test
      PLAID_SECRET: ci-test
      PLAID_ENV: sandbox
      # The receiver checks webhook signatures against Plaid's public key; the
      # stub (opulus-tests/services/backend/stub/plaid.mjs, started below) serves a
      # key of its own, so the specs can sign webhooks the receiver accepts.
      PLAID_BASE_URL: http://localhost:4546
      TEST_BASE_URL: http://localhost:8081

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_dev
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @opulus/core prisma:generate

      - name: Build core package
        run: pnpm --filter @opulus/core build

      - name: Apply database migrations
        run: pnpm --filter @opulus/core exec prisma migrate deploy --schema=./prisma/schema.prisma

      - name: Start the Plaid stub
        run: |
          node opulus-tests/services/backend/stub/plaid.mjs &
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:4546/health" >/dev/null; then
              echo "Plaid stub is up"; exit 0
            fi
            sleep 1
          done
          echo "Plaid stub did not start in time" >&2
          exit 1

      - name: Boot webhooks service
        run: |
          NODE_V8_COVERAGE="$GITHUB_WORKSPACE/coverage/webhooks" pnpm --filter @opulus/webhooks exec tsx src/server.ts &
          echo $! > /tmp/webhooks.pid
          for i in $(seq 1 60); do
            if curl -sf "$TEST_BASE_URL/health" >/dev/null; then
              echo "Webhooks receiver is up"; exit 0
            fi
            sleep 1
          done
          echo "Webhooks receiver did not become healthy in time" >&2
          exit 1

      - name: Run webhooks service-api tests
        run: pnpm --filter @opulus/tests test:services-webhooks

      # How much of the service's code the suite ran, for finding what no test
      # reaches. Informational: it never fails the job. The service is stopped
      # with SIGTERM so it writes its coverage on the way out.
      - name: Report Webhooks coverage
        if: always()
        continue-on-error: true
        run: |
          pkill -TERM -f "src/server.ts" || true
          sleep 5
          {
            echo '### Webhooks coverage (lines the service-api suite ran)'
            echo '```'
            pnpm exec c8 report --temp-directory coverage/webhooks --report-dir coverage/webhooks-report \
              --reporter text-summary --reporter lcovonly --all --src opulus-webhooks/src --src opulus-core/src \
              --exclude-after-remap --exclude '**/node_modules/**' --exclude '**/*.d.ts'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Webhooks coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-webhooks
          path: coverage/webhooks-report
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Scheduler: its jobs API and what each job stores, with the provider stubbed
  # (opulus-tests/services/scheduler/stub). Not yet a required check: to make it
  # one, add "Scheduler service-api tests" to main's branch protection.
  # ---------------------------------------------------------------------------
  scheduler-service-api-tests:
    name: Scheduler service-api tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://app:app_dev@localhost:5432/app_test?schema=public
      TEST_DATABASE_URL: postgresql://app:app_dev@localhost:5432/app_test?schema=public
      NODE_ENV: test
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      SCHEDULER_PORT: "8082"
      # A fixed, test-only token for the scheduler's jobs API.
      SCHEDULER_ADMIN_TOKEN: ci-scheduler-tests-token-not-a-secret
      # The specs run every job themselves; a start-up run would race them.
      SCHEDULER_RUN_ON_START: "false"
      # No third party: the scheduler asks the stub for rates.
      FRANKFURTER_BASE_URL: http://localhost:4545/v1
      STUB_URL: http://localhost:4545
      TEST_BASE_URL: http://localhost:8082

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_dev
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @opulus/core prisma:generate

      - name: Build core package
        run: pnpm --filter @opulus/core build

      - name: Apply database migrations
        run: pnpm --filter @opulus/core exec prisma migrate deploy --schema=./prisma/schema.prisma

      - name: Start the Frankfurter stub
        run: |
          node opulus-tests/services/scheduler/stub/frankfurter.mjs &
          for i in $(seq 1 30); do
            if curl -sf "$STUB_URL/health" >/dev/null; then
              echo "Stub is up"; exit 0
            fi
            sleep 1
          done
          echo "Stub did not start in time" >&2
          exit 1

      - name: Boot the scheduler
        run: |
          NODE_V8_COVERAGE="$GITHUB_WORKSPACE/coverage/scheduler" pnpm --filter @opulus/scheduler exec tsx src/server.ts &
          for i in $(seq 1 60); do
            if curl -sf "$TEST_BASE_URL/health" >/dev/null; then
              echo "Scheduler is up"; exit 0
            fi
            sleep 1
          done
          echo "Scheduler did not become healthy in time" >&2
          exit 1

      - name: Run scheduler service-api tests
        run: pnpm --filter @opulus/tests test:services-scheduler

      # How much of the service's code the suite ran, for finding what no test
      # reaches. Informational: it never fails the job. The service is stopped
      # with SIGTERM so it writes its coverage on the way out.
      - name: Report Scheduler coverage
        if: always()
        continue-on-error: true
        run: |
          pkill -TERM -f "src/server.ts" || true
          sleep 5
          {
            echo '### Scheduler coverage (lines the service-api suite ran)'
            echo '```'
            pnpm exec c8 report --temp-directory coverage/scheduler --report-dir coverage/scheduler-report \
              --reporter text-summary --reporter lcovonly --all --src opulus-scheduler/src --src opulus-core/src \
              --exclude-after-remap --exclude '**/node_modules/**' --exclude '**/*.d.ts'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Scheduler coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-scheduler
          path: coverage/scheduler-report
          if-no-files-found: ignore
