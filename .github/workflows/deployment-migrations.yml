# Migration tests: the Prisma migrations apply cleanly to an empty database and
# leave exactly the schema in prisma/schema.prisma. A migration that fails halfway,
# or a change to the schema file with no migration for it, fails here and not on deploy.

name: Migration Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  migrations:
    name: Migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # The suite creates its own scratch database on this server and drops it.
      DATABASE_URL: postgresql://app:app_dev@localhost:5432/app_test?schema=public

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_dev
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @opulus/core prisma:generate

      - name: Build core package
        run: pnpm --filter @opulus/core build

      - name: Run migration tests
        run: pnpm --filter @opulus/tests test:deployment-migrations
