# Redis persistence config for the webhook queue.
#
# The webhook pipeline ACKs Plaid immediately and relies on Redis to hold jobs
# until the worker processes them. Persistence is therefore required so a Redis
# restart does not silently drop queued-but-unprocessed webhooks.

# Append-only file: the durable log of write operations.
appendonly yes

# Fsync the AOF once per second. Good durability/throughput trade-off:
# at most ~1s of writes can be lost on a hard crash.
appendfsync everysec

# Keep RDB snapshots as a secondary safety net / faster restarts.
save 900 1
save 300 10
save 60 10000

dir /data
